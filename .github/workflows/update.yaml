name: Update site

on:
  schedule:
    - cron: "17 7 * * *"        # nightly backstop, ~3am Eastern
  workflow_dispatch:             # "Run workflow" button, and the sheet's Apps Script
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          A: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          B: ${{ secrets.SHEET_ID }}
          C: ${{ secrets.SITE_PASSWORD }}
          D: ${{ secrets.STATICRYPT_SALT }}
        run: |
          for v in A B C D; do
            [ -n "${!v}" ] || { echo "A required secret is missing (see README)"; exit 1; }
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g staticrypt@3

      - name: Read the sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python scripts/sheet.py

      - name: Build site
        run: python scripts/build.py

      - name: Encrypt site
        env:
          STATICRYPT_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          STATICRYPT_SALT: ${{ secrets.STATICRYPT_SALT }}
        working-directory: build
        run: |
          staticrypt index.html -d ../dist \
            --salt "$STATICRYPT_SALT" -c false \
            --short --remember 180 \
            --template-button "Open" \
            --template-color-primary "#1f5f7a" --template-color-secondary "#eef2ef" \
            --template-title "College research" \
            --template-instructions "Enter the family password. Check 'Remember me' so you only need to do this once on this device."
          cp robots.txt .nojekyll ../dist/
          # Safety check: the published page must be encrypted.
          grep -q "staticrypt" ../dist/index.html || { echo "index.html is not encrypted"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
