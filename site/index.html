<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>College research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef2ef;
    --sheet: #fbfcfb;
    --ink: #1d2b2a;
    --muted: #5f6f6c;
    --rule: #cbd5d1;
    --accent: #1f5f7a;
    --fill: #d6e6ec;
    --fill-hover: #bfd8e2;
    --warn: #8a4b12;
    --head: "Bitter", Georgia, serif;
    --body: "Atkinson Hyperlegible", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--body); }
  a { color: var(--accent); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  header.top { padding: 28px 24px 12px; max-width: 1200px; margin: 0 auto; }
  h1 { font: 700 2rem/1.1 var(--head); margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  #search { flex: 1 1 260px; max-width: 420px; padding: 9px 12px; border: 1px solid var(--rule);
            border-radius: 6px; background: var(--sheet); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px;
         padding: 3px 11px; cursor: pointer; font-size: .9rem; }
  .tag[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  main { max-width: 1200px; margin: 0 auto; padding: 8px 24px 60px; }
  section.school { margin: 26px 0 0; }
  h2 { font: 700 1.45rem/1.2 var(--head); margin: 0 0 8px; }
  h3 { font: 500 1.15rem/1.2 var(--head); margin: 36px 0 8px; }
  .scroll { overflow-x: auto; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; }

  table.grid { border-collapse: collapse; width: 100%; min-width: 520px; table-layout: fixed; }
  .grid th, .grid td { border-bottom: 1px solid var(--rule); padding: 0; text-align: left; vertical-align: middle; }
  .grid thead th { font-weight: 700; font-size: .85rem; color: var(--muted); padding: 10px 8px; white-space: nowrap; }
  .grid tbody tr:last-child > * { border-bottom: 0; }
  .grid th.major { padding: 10px 14px; font-weight: 700; width: 22%; }
  .grid td { padding: 6px; }
  .cell { display: block; width: 100%; min-height: 40px; border-radius: 5px; border: 0;
          background: var(--fill); cursor: pointer; text-align: left; padding: 8px 10px; font-size: .9rem; }
  .cell:hover { background: var(--fill-hover); }
  .cell .n { color: var(--muted); }
  .empty { display: block; min-height: 40px; border: 1.5px dashed var(--rule); border-radius: 5px; }
  .missing { display: none; }

  ul.plain { list-style: none; padding: 0; margin: 0; background: var(--sheet);
             border: 1px solid var(--rule); border-radius: 8px; }
  ul.plain li { padding: 10px 14px; border-bottom: 1px solid var(--rule); }
  ul.plain li:last-child { border-bottom: 0; }
  .linkish { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; text-align: left; }
  .meta { color: var(--muted); font-size: .9rem; }
  .err { color: var(--warn); font-size: .9rem; }
  .blank { padding: 40px 0; color: var(--muted); max-width: 60ch; }

  /* Reader */
  #reader { position: fixed; inset: 0 0 0 auto; width: min(760px, 100%); background: var(--sheet);
            border-left: 1px solid var(--rule); box-shadow: -8px 0 30px rgba(29,43,42,.12);
            display: flex; flex-direction: column; transform: translateX(100%);
            transition: transform .2s ease; visibility: hidden; z-index: 10; }
  #reader.open { transform: none; visibility: visible; }
  .rhead { padding: 14px 18px 12px; border-bottom: 1px solid var(--rule); }
  .rrow { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
  .rtitle { font: 700 1.25rem/1.25 var(--head); margin: 0; }
  .crumbs { color: var(--muted); font-size: .92rem; margin: 2px 0 10px; }
  .ractions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .92rem; }
  .btn { border: 1px solid var(--rule); background: var(--paper); border-radius: 6px; padding: 5px 11px;
         cursor: pointer; text-decoration: none; color: var(--ink); display: inline-block; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn[disabled] { opacity: .4; cursor: default; }
  .close { font-size: 1.4rem; line-height: 1; padding: 4px 10px; }
  #rbody { flex: 1; overflow-y: auto; padding: 6px 18px 40px; }
  article.entry { padding: 18px 0; border-bottom: 1px solid var(--rule); }
  article.entry:last-child { border-bottom: 0; }
  .elabel { font-weight: 700; margin: 0 0 10px; overflow-wrap: anywhere; }
  blockquote.key { margin: 0 0 12px; padding: 12px 16px; background: var(--paper); border-left: 3px solid var(--accent);
                   border-radius: 0 6px 6px 0; white-space: pre-wrap; max-width: 70ch; }
  .nokey { color: var(--muted); font-style: italic; margin: 0 0 12px; }
  .note { margin: 0 0 12px; max-width: 70ch; white-space: pre-wrap; }
  .note b { font-weight: 700; }
  .elinks { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .92rem; }

  @media (max-width: 700px) {
    header.top, main { padding-left: 14px; padding-right: 14px; }
    h1 { font-size: 1.6rem; }
    .scroll { overflow: visible; }
    table.grid, .grid tbody, .grid tr, .grid th, .grid td { display: block; min-width: 0; width: auto; }
    .grid thead { display: none; }
    .grid tr { padding: 10px 12px; border-bottom: 1px solid var(--rule); }
    .grid tbody tr:last-child { border-bottom: 0; }
    .grid th.major, .grid td { border: 0; padding: 0; }
    .grid th.major { margin-bottom: 6px; width: auto; }
    .grid td { display: inline-block; margin: 0 6px 6px 0; }
    .grid td.is-empty { display: none; }
    .cell { min-height: 0; padding: 6px 10px; }
    .cell::before { content: attr(data-label); font-weight: 700; margin-right: 4px; }
    .cell .n { display: inline; }
    .missing { display: block; color: var(--muted); font-size: .85rem; font-weight: 400; }
    #reader { border-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { #reader { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <h1>College research</h1>
  <p class="sub">Schools' own words, organized by school, major, and kind of information.</p>
  <div class="controls">
    <input id="search" type="search" placeholder="Search schools, majors, text, notes" aria-label="Search">
    <div class="tags" id="tags"></div>
  </div>
</header>
<main id="main"></main>

<aside id="reader" aria-hidden="true" aria-label="Details">
  <div class="rhead">
    <div class="rrow">
      <div>
        <p class="rtitle" id="rtitle"></p>
        <p class="crumbs" id="rcrumbs"></p>
      </div>
      <button class="btn close" id="rclose" aria-label="Close">×</button>
    </div>
    <div class="ractions" id="ractions"></div>
  </div>
  <div id="rbody"></div>
</aside>

<script>
const DATA = /*__DATA__*/null;
const items = DATA.items;
const infoTypes = DATA.infoTypes;
const state = { q: "", tags: new Set() };
let current = null;   // { list, index, versionIndex }

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const byName = (a, b) => a.localeCompare(b, undefined, { sensitivity: "base" });
const sorted = i => i.school && i.major && i.info;
const label = i => i.label || i.url;

function visible(i) {
  if (state.tags.size && ![...state.tags].every(t => i.tags.includes(t))) return false;
  if (!state.q) return true;
  const hay = [i.school, i.major, i.info, i.url, i.keyText, i.notes, i.addedBy, ...i.tags].join(" ").toLowerCase();
  return state.q.split(/\s+/).every(w => hay.includes(w));
}

function renderTags() {
  const all = [...new Set(items.flatMap(i => i.tags))].sort(byName);
  document.getElementById("tags").innerHTML = all.map(t =>
    `<button class="tag" aria-pressed="${state.tags.has(t)}" data-tag="${esc(t)}">${esc(t)}</button>`).join("");
}

function render() {
  const main = document.getElementById("main");
  if (!items.length) {
    main.innerHTML = `<p class="blank">No pages yet. Add a link through the family form, and it will show up here after the next update.</p>`;
    return;
  }
  const shown = items.filter(visible);
  const good = shown.filter(sorted);
  const schools = [...new Set(good.map(i => i.school))].sort(byName);
  let html = "";

  for (const school of schools) {
    const inSchool = good.filter(i => i.school === school);
    const majors = [...new Set(inSchool.map(i => i.major))].sort(byName);
    html += `<section class="school"><h2>${esc(school)}</h2><div class="scroll"><table class="grid">
      <thead><tr><th class="major">Major</th>${infoTypes.map(t => `<th>${esc(t)}</th>`).join("")}</tr></thead><tbody>`;
    for (const major of majors) {
      const row = inSchool.filter(i => i.major === major);
      const missing = infoTypes.filter(t => !row.some(i => i.info === t));
      html += `<tr><th class="major" scope="row">${esc(major)}
        ${missing.length ? `<span class="missing">Nothing yet for: ${missing.map(esc).join(", ")}</span>` : ""}</th>`;
      for (const t of infoTypes) {
        const pages = row.filter(i => i.info === t);
        html += pages.length
          ? `<td><button class="cell" data-label="${esc(t)}" data-open="${esc(JSON.stringify([school, major, t]))}">
               ${pages.length === 1 ? esc(truncate((pages[0].keyText || label(pages[0])).replace(/\s+/g, " "), 60)) : `<span class="n">${pages.length} pages</span>`}${pages.some(p => p.notes) ? `<span class="has-note" title="Has notes" aria-label="has notes">✎</span>` : ""}
             </button></td>`
          : `<td class="is-empty"><span class="empty" aria-label="Nothing yet"></span></td>`;
      }
      html += `</tr>`;
    }
    html += `</tbody></table></div></section>`;
  }

  const unsorted = shown.filter(i => !sorted(i));
  if (unsorted.length) {
    html += `<h3>Unsorted</h3><ul class="plain">${unsorted.map(i => `<li>
      <button class="linkish" data-single="${items.indexOf(i)}">${esc(label(i))}</button>
      <div class="meta">Missing ${["school","major","info"].filter(k => !i[k]).map(k => k === "info" ? "info type" : k).join(", ")} in the sheet</div></li>`).join("")}</ul>`;
  }

  if (!html) html = `<p class="blank">Nothing matches. Clear the search or tag filters to see everything.</p>`;
  main.innerHTML = html;
}

function truncate(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }

// Reader: shows every page in one cell (school + major + info type). Prev/next
// walks the same info type across all schools and majors, for comparing.
function openCell(school, major, info) {
  current = { school, major, info,
    list: items.filter(i => visible(i) && i.school === school && i.major === major && i.info === info) };
  showReader();
}
function openSingle(idx) {
  const i = items[idx];
  current = { school: i.school, major: i.major, info: i.info, list: [i], single: true };
  showReader();
}
function sameTypeCells(info) {
  const cells = [];
  for (const i of items.filter(i => visible(i) && sorted(i) && i.info === info)
    .sort((a, b) => byName(a.school, b.school) || byName(a.major, b.major))) {
    if (!cells.some(c => c.school === i.school && c.major === i.major)) cells.push({ school: i.school, major: i.major });
  }
  return cells;
}
const archiveUrl = u => "https://web.archive.org/web/2/" + u;

function entryHtml(i) {
  return `<article class="entry">
    <p class="elabel">${esc(label(i))}</p>
    ${i.keyText ? `<blockquote class="key">${esc(i.keyText)}</blockquote>`
                : `<p class="nokey">No text pasted for this page.</p>`}
    ${i.notes ? `<p class="note"><b>Note${i.addedBy ? " from " + esc(i.addedBy) : ""}:</b> ${esc(i.notes)}</p>`
              : (i.addedBy ? `<p class="meta">Added by ${esc(i.addedBy)}</p>` : "")}
    <div class="elinks">
      <a class="btn primary" href="${esc(i.url)}" target="_blank" rel="noopener">Open school's page</a>
      <a class="btn" href="${esc(archiveUrl(i.url))}" target="_blank" rel="noopener" title="Use if the page has moved or changed">Archived copy</a>
      ${i.tags.length ? `<span class="meta">${i.tags.map(esc).join(", ")}</span>` : ""}
    </div>
  </article>`;
}

function showReader() {
  const c = current;
  document.getElementById("rtitle").textContent = c.single ? label(c.list[0]) : (c.info || "Page");
  document.getElementById("rcrumbs").textContent = [c.school, c.major, c.single ? c.info : ""].filter(Boolean).join(" / ");

  let actions = "";
  if (!c.single && c.school && c.major && c.info) {
    const cells = sameTypeCells(c.info);
    const pos = cells.findIndex(x => x.school === c.school && x.major === c.major);
    const prev = cells[pos - 1], next = cells[pos + 1];
    actions = `<button class="btn" data-step="-1" ${prev ? "" : "disabled"}>‹ ${prev ? esc(prev.school) : "Previous"}</button>
               <button class="btn" data-step="1" ${next ? "" : "disabled"}>${next ? esc(next.school) : "Next"} ›</button>
               <span class="meta">${pos + 1} of ${cells.length} with ${esc(c.info)}</span>`;
  }
  document.getElementById("ractions").innerHTML = actions;
  document.getElementById("rbody").innerHTML = c.list.map(entryHtml).join("");
  document.getElementById("rbody").scrollTop = 0;

  const r = document.getElementById("reader");
  r.classList.add("open");
  r.setAttribute("aria-hidden", "false");
  document.getElementById("rclose").focus();
}

function closeReader() {
  const r = document.getElementById("reader");
  r.classList.remove("open");
  r.setAttribute("aria-hidden", "true");
}

document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.tag !== undefined) {
    state.tags.has(t.dataset.tag) ? state.tags.delete(t.dataset.tag) : state.tags.add(t.dataset.tag);
    renderTags(); render();
  } else if (t.dataset.open) {
    openCell(...JSON.parse(t.dataset.open));
  } else if (t.dataset.single !== undefined) {
    openSingle(+t.dataset.single);
  } else if (t.dataset.step) {
    const cells = sameTypeCells(current.info);
    const pos = cells.findIndex(x => x.school === current.school && x.major === current.major);
    const next = cells[pos + +t.dataset.step];
    if (next) openCell(next.school, next.major, current.info);
  } else if (t.id === "rclose") {
    closeReader();
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeReader(); });
document.getElementById("search").addEventListener("input", e => {
  state.q = e.target.value.trim().toLowerCase(); render();
});

renderTags();
render();
</script>
</body>
</html>
